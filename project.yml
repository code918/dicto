name: Dicto
options:
  bundleIdPrefix: com.lake514
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # 본인 Apple 개발자 팀 ID
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  Dicto:
    build:
      targets:
        Dicto: all
    run:
      config: Debug
      executable: Dicto
    archive:
      config: Release

targets:
  Dicto:
    type: application
    platform: macOS
    sources:
      - path: Dicto
    info:
      path: Dicto/Info.plist
      properties:
        CFBundleDisplayName: Dicto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: 음성을 받아 적기 위해 마이크를 사용합니다.
        NSSpeechRecognitionUsageDescription: 온디바이스 실시간 받아쓰기에 사용합니다.
        NSAppleEventsUsageDescription: 받아 적은 텍스트를 현재 앱에 붙여넣기 위해 사용합니다.
        NSHumanReadableCopyright: "Lake514"
    entitlements:
      path: Dicto/Dicto.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lake514.dicto
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "NO"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Dicto/Support/Dicto-Bridging-Header.h
        HEADER_SEARCH_PATHS: /opt/homebrew/include
        LIBRARY_SEARCH_PATHS: /opt/homebrew/lib
        OTHER_LDFLAGS: "-lwhisper -lggml -lggml-base"
        ENABLE_PREVIEWS: "NO"
